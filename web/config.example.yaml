# Copy this file to config.yaml and customize the values for your environment.
listenAddr: ":8080"
baseURL: "http://localhost:8080"
storageDir: "data"
apiKeys:
  - "replace-me"
rateLimit:
  requestsPerMinute: 120 # average number of requests allowed per minute
  burst: 60 # additional burst size allowed for short spikes
upload:
  maxBytes: 20970000 # maximum upload size in bytes (default 20 MB)
